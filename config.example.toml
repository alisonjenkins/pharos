[server]
bind = "0.0.0.0:8096"
name = "pharos"
# Path to the built Dioxus UI bundle. Produce with:
#   nix develop --command dx build --package pharos-ui --release
# Then point this at the resulting `web/public/` directory and the
# server will serve it at /ui/*.
# ui_dir = "/srv/pharos/ui/public"
# Seconds between database writes of one play session's resume position.
# Clients report every ~10 s and writing each report made the progress
# route the busiest and slowest in the server, so reports in between are held
# in memory (roughly one write per 15-20 s per active session at the
# default). Written at once, never held: the first report of a session, a
# pause or unpause, a seek, and Stopped. Held reports of sessions that go
# quiet are written within ~1.3 intervals, and all of them on a graceful
# shutdown. Trade-off: a crash or SIGKILL loses the held report of each live
# session, i.e. at most this many seconds of resume position. 0 writes every
# report (the old behaviour).
# playback_progress_persist_secs = 15
# VAAPI only. Keep decoded frames on the GPU from decoder to encoder instead of
# downloading them, running CPU filters and uploading them again. Used for
# H.264/HEVC targets with no burned-in subtitles, a plain 8-bit SDR source and
# no rotation or interlacing; every other job keeps the CPU-filter pipeline,
# and a GPU-resident run that fails is retried once on it. See
# pharos_transcode_vaapi_pipeline_total{verdict} and
# pharos_transcode_vaapi_resident_fallback_total{reason}. Default false.
# transcode_vaapi_gpu_resident = false
# Per-segment encode timing, exported as
# pharos_transcode_stage_seconds{device_kind,codec,stage} and as one
# "transcode stage timing" event on the transcode_job span.
#   "basic"    (default) spawn, time to first frame, total, frames, fps, speed
#   "detailed" adds ffmpeg -benchmark_all decode/encode/flush seconds; runs
#              ffmpeg at -loglevel info, so use it to diagnose, not always
#   "off"      records nothing
# transcode_stage_timing = "basic"

[obs]
log_level = "info"
# otlp_endpoint = "http://localhost:4317"
# Fraction (0.0-1.0) of new traces exported over OTLP. A request carrying a
# sampled traceparent is always kept; only traces started here are thinned.
# 1.0 (default) exports every trace.
# sampling_ratio = 0.1

[media]
roots = ["/srv/media"]

[database]
url = "sqlite:./pharos.db?mode=rwc"

# Track preferences a NEWLY created user starts with. Jellyfin has no
# server-wide default — every account begins at the stock values and each
# person re-picks them by hand, which on a shared server means everyone hits
# the same wrong-language playback first. Existing accounts are untouched;
# users can still change any of this in jellyfin-web afterwards. Omit the
# section entirely to keep Jellyfin's own defaults.
#
# [user_defaults]
# # An ISO 639 code ("eng"), or "OriginalLanguage" to rank each title by the
# # language it was made in — Japanese for anime, English for Hollywood, from
# # one setting. Needs metadata enrichment to have recorded the title's
# # original language; unenriched items fall back to the container's order.
# audio_language_preference = "OriginalLanguage"
# subtitle_language_preference = "eng"
# # Default | Always | OnlyForced | None | Smart. "Smart" shows subtitles only
# # when the audio is NOT in a language you read — the other half of the
# # anime split.
# subtitle_mode = "Smart"
# # Jellyfin defaults this true, which lets a container's default-flagged
# # track BEAT the language preference (a film whose only default-flagged
# # audio is a dub keeps playing that dub). Set false for the preference to
# # decide.
# play_default_audio_track = false
