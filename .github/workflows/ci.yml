name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs on the same ref when a newer push lands, except on
# main: there a cancelled run can be mid-publish, and the image never ships
# (B283). A newer main push queues behind the running one instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether this run needs the heavy jobs. A PR that touches only
  # Markdown builds nothing and tests nothing, yet every job below used to
  # take a home runner slot for it. Runs on a hosted runner so the decision
  # itself never waits for a home slot. Every job below is gated with
  # `needs.changes.outputs.code != 'false'`: a job skipped by its `if:`
  # reports success, so required checks still pass, and if this job fails
  # the output is empty and the heavy jobs run anyway (fail open).
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              # Read at test time by jellyfin_feature_inventory.rs.
              docs/jellyfin-web-feature-matrix.md) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            echo "$path -> code=$code"
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: build + test + lint
    # Self-hosted home nix builder (host daemon + warm store). Other jobs stay
    # on ubuntu-latest.
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    # Never run fork-PR code on the self-hosted runner (the enforcer's fork-PR
    # approval gate is the primary control; this is a backstop).
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event.pull_request.head.repo.fork != true }}
    steps:
      - uses: actions/checkout@v7

      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      # The build node's auto-GC deletes any store path nothing roots (B284),
      # and a `nix build --no-link` result has no root, so a job often
      # recompiled all of crates.io that an earlier job had just built.
      # Root the compiled deps in the host's gcroots drop box, which the
      # host daemon can see (a root under the pod's $TMP dangles).
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"

      # One command builds `.#pharos` and runs the WHOLE workspace suite
      # (nextest, `--profile nix` timeouts), clippy (`-D warnings`), rustfmt,
      # and doctests — each a crane flake `check` sharing ONE cached
      # cargoArtifacts, run in PARALLEL by nix. Crucially these test the ACTUAL
      # shipped artifact (same source + toolchain the image is built from), not
      # a separately cargo-built one, and the deps are store-cached instead of
      # recompiled every ephemeral-runner run.
      #
      # T80 — the store suite against a REAL postgres — is `checks.postgres`
      # (`pharosPgTests` in flake.nix), so it runs inside this same command,
      # in parallel with the other checks. The postgres arms skip themselves
      # in the plain workspace nextest (PHAROS_TEST_POSTGRES_URL unset), and
      # sqlx checks neither placeholder arity nor column names at compile
      # time, so that check is what catches a postgres-only defect (e.g. the
      # `mark_seen_batch` override that existed for sqlite only, T117).
      # `just test-postgres` is the local equivalent of the same check.
      - name: nix flake check (build + tests + clippy + fmt + doctests + postgres)
        run: nix flake check -L
      # `checks.workspace-build` and the `oci` job build the same release
      # `pharos`; whichever runs second reuses it only if it survived GC.
      # Root it for this run, and drop this repo's run roots older than 4 h.
      - name: Pin this run's release build against auto-GC
        run: |
          find /nix/var/nix/gcroots/gha -maxdepth 1 -name 'pharos-run-*' -mmin +240 -delete || true
          nix build .#pharos --out-link "/nix/var/nix/gcroots/gha/pharos-run-${GITHUB_RUN_ID}" || echo "::warning::could not pin the release build"

  audit:
    name: supply-chain
    # Self-hosted home nix builder (host daemon + warm store), same as the
    # other jobs — no Azure-hosted runner + no DeterminateSystems installer /
    # magic-nix-cache round-trip.
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    continue-on-error: false
    # Never run fork-PR code on the self-hosted runner (backstop to the
    # enforcer's fork-PR approval gate; matches the `test` job).
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event.pull_request.head.repo.fork != true }}
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: cargo-audit (RustSec)
        run: nix develop --command cargo audit
      - name: cargo-deny (licenses + bans)
        run: nix develop --command cargo deny check

  oci:
    name: package + oci image
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # NO `needs: [test]`: this nix build shares nothing with the cargo build in
    # `test`, so gating it behind test only serialised ~4 min after ~3 min. Run
    # it in PARALLEL — `publish` still `needs: [test, oci]`, so a failing test
    # never ships an image. On PRs this is the sole validation that BOTH images
    # (pharos + jellyfin-web) still build. With crane's cached dep artifact,
    # only changed workspace crates recompile here.
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: Pin this run's release build against auto-GC
        run: nix build .#pharos --out-link "/nix/var/nix/gcroots/gha/pharos-run-${GITHUB_RUN_ID}" || echo "::warning::could not pin the release build"
      # Build both images into the (host-shared, warm) nix store. `publish`
      # reuses these exact store paths as instant cache hits — no artifact
      # upload/download round-trip of a ~100 MB tarball.
      - name: Build OCI images
        run: |
          nix build .#oci            --no-link --print-out-paths
          nix build .#jellyfinWebOci --no-link --print-out-paths

  publish:
    name: publish images (ghcr)
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [test, oci]
    # Only on a push that landed on main — PRs build the images (oci job)
    # but must not publish. Consumes the tarballs the `oci` job already built
    # (build-once): no second `nix build`, just download + push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Push images to GHCR (latest + immutable sha tags)
        env:
          # The workflow token: both GHCR packages grant this repo Write under
          # "Manage Actions access", so no expiring PAT is needed.
          GHCR_CREDS: ${{ github.actor }}:${{ github.token }}
        run: |
          set -euo pipefail
          # Flux image automation orders tags numerically, and a commit SHA
          # doesn't sort. Add a monotonic `main-<commit-unix-ts>-<shortsha>`
          # tag: the timestamp lets the ImagePolicy pick the newest build while
          # the short SHA keeps it traceable. `latest` + full SHA stay for
          # humans / manual pins.
          COMMIT_TS="$(git show -s --format=%ct HEAD)"
          SORTABLE="main-${COMMIT_TS}-${GITHUB_SHA:0:12}"
          # `.#oci` / `.#jellyfinWebOci` are streamLayeredImage SCRIPTS (built by
          # `needs: [oci]` into the warm store → instant cache hits). Each writes
          # the image tar to stdout; stream it ONCE into a local OCI layout, then
          # push every tag from that layout — one assembly per image, no per-tag
          # re-stream, no gzipped store tarball, no artifact round-trip.
          # The store is the host daemon's: its auto-GC can delete any path this
          # pod cannot root (B284). Build each script right before streaming it,
          # and rebuild and re-stream once if a path vanished.
          publish() {
            attr="$1"; repo="$2"
            stage="$(mktemp -d)/img"
            for attempt in 1 2; do
              script="$(nix build ".#${attr}" --no-link --print-out-paths)"
              if "$script" | nix develop --command skopeo --insecure-policy copy \
                   docker-archive:/dev/stdin "oci:${stage}:img"; then
                break
              fi
              present=no; [[ -e "$script" ]] && present=yes
              echo "publish: stream of ${attr} failed, attempt ${attempt}, script ${script} present=${present}" >&2
              [[ $attempt -eq 2 ]] && return 1
              rm -rf "$stage"
            done
            for tag in latest "$GITHUB_SHA" "$SORTABLE"; do
              nix develop --command skopeo --insecure-policy copy \
                --dest-creds "$GHCR_CREDS" \
                "oci:${stage}:img" "docker://${repo}:${tag}"
            done
          }
          publish oci            ghcr.io/alisonjenkins/pharos
          publish jellyfinWebOci ghcr.io/alisonjenkins/pharos-jellyfin-web

  compat-playwright:
    name: jellyfin-web crawl
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # NO `needs: [test]`. This job builds what it needs through `just`, so
    # nothing it does depends on the flake check having passed — waiting for
    # it only serialised ~2m45s onto the end of every PR run (measured: the
    # crawl is consistently the LAST job to finish, and is what sets the PR's
    # total wall clock). `publish` still needs `test`, so a failing check
    # cannot ship an image regardless of what this job does.
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: npm install
        run: nix develop --command bash -c 'cd compat-playwright && npm install --no-audit --no-fund'
      # Browser binaries come from the nix-pinned playwright-driver
      # (PLAYWRIGHT_BROWSERS_PATH, exported by the devShell). No
      # `npx playwright install` — the @playwright/test version is pinned
      # to match playwright-driver so the store path has the right rev.
      # `pharosTestBins` reuses the flake check's `ci`-profile deps from the
      # shared store, so only the workspace crates compile, instead of a cold
      # `cargo build` of the whole tree in this job.
      - name: Build pharos test binaries
        run: |
          out="$(nix build .#pharosTestBins --no-link --print-out-paths)"
          echo "PHAROS_BIN_DIR=$out/bin" >> "$GITHUB_ENV"
      - name: Run Playwright crawl
        run: nix develop --command bash -c 'just compat-playwright-full'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: compat-playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Dioxus UI suite, once per native-API mode. Each mode seeds its own pharos
  # (see `just compat-dioxus-full`), so the two runs share nothing. They run
  # one after the other in ONE job: every job waits for a home runner on its
  # own, so a matrix leg was a second trip through the queue for a ~3 min
  # suite. The `off` step runs even when `on` failed, so both results show.
  dioxus-ui:
    name: dioxus UI
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: npm install
        run: nix develop --command bash -c 'cd compat-playwright && npm install --no-audit --no-fund'
      - name: Run Dioxus UI suite (native on)
        id: native-on
        run: nix develop --command bash -c 'just compat-dioxus-full on'
      - name: Upload Dioxus UI artifacts (native on) on failure
        if: failure() && steps.native-on.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: dioxus-ui-native-on-${{ github.sha }}
          path: |
            compat-playwright/test-results
            compat-playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Dioxus UI suite (native off)
        id: native-off
        if: ${{ !cancelled() && steps.native-on.conclusion != 'skipped' }}
        run: nix develop --command bash -c 'just compat-dioxus-full off'
      - name: Upload Dioxus UI artifacts (native off) on failure
        if: ${{ !cancelled() && steps.native-off.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: dioxus-ui-native-off-${{ github.sha }}
          path: |
            compat-playwright/test-results
            compat-playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7
