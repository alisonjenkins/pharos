name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs on the same ref when a newer push lands, except on
# main: there a cancelled run can be mid-publish, and the image never ships
# (B283). A newer main push queues behind the running one instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether this run needs the heavy jobs. Only three kinds of run
  # do: a push to main, a `batch/` PR (the merge queue stacks feature PRs
  # onto one and merges that), and a release-please PR. A feature or
  # Renovate PR is reviewed on its own but tested only inside a batch:
  # every push to one used to take four home runner slots, and pushes and
  # re-cuts of feature PRs were most of the runner time on 2026-11-04.
  # Within those three, a change touching only Markdown still skips them.
  # Runs on a hosted runner so the decision never waits for a home slot.
  # Every heavy job is gated with `needs.changes.outputs.code != 'false'`:
  # a job skipped by its `if:` reports success, so `merge via batch` below
  # is what stops a feature PR merging on skipped checks. If this job fails
  # its output is empty and the heavy jobs run anyway (fail open).
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    # Read-only: the main-push check below reads the merged PR and its runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A fork never reaches the home runners, whatever it names its branch.
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "$HEAD_REPO is a fork: no heavy jobs on the self-hosted runners"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$HEAD_REF" in
            batch/*|release-please--*) ;;
            *)
              echo "$HEAD_REF is not a batch: heavy jobs run when the merge queue batches it"
              echo "code=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          code=false
          while IFS= read -r path; do
            case "$path" in
              # Read at test time by jellyfin_feature_inventory.rs.
              docs/jellyfin-web-feature-matrix.md) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            echo "$path -> code=$code"
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # A push to main that a batch rebase-merge made carries the exact tree
      # the batch PR's CI already passed, yet it ran every heavy job again:
      # 40 to 50 min on all four home runners, just as the queue started the
      # next batch (FO's dioxus job waited 15 min, FP's 9). When the pushed
      # tree equals a merged batch/ PR head whose ci run passed, the tests are
      # skipped and only oci + publish run. Anything else (a direct push, a
      # release-please merge, main moved under the batch, any lookup error)
      # leaves tested empty and runs everything, as before (fail open).
      - name: Was this tree already tested as a batch?
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          verdict() { echo "main tree check: $1"; }
          tree="$(git rev-parse "${GITHUB_SHA}^{tree}")" || { verdict "no tree for $GITHUB_SHA, running tests"; exit 0; }
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and (.head.ref | startswith("batch/"))) | "\(.number) \(.head.sha) \(.head.ref)"')" \
            || { verdict "PR lookup failed, running tests"; exit 0; }
          if [[ -z "$prs" ]]; then verdict "$GITHUB_SHA is not from a merged batch PR, running tests"; exit 0; fi
          while read -r number head ref; do
            head_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)" || continue
            if [[ "$head_tree" != "$tree" ]]; then
              verdict "#$number ($ref) head $head has tree $head_tree, main has $tree, running tests"
              continue
            fi
            green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" \
              --jq '[.workflow_runs[] | select(.head_branch | startswith("batch/"))] | length')" || continue
            if [[ "$green" -gt 0 ]]; then
              verdict "#$number ($ref) head $head passed ci on tree $tree, skipping tests"
              echo "tested=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            verdict "#$number ($ref) head $head has the same tree but no passed ci run, running tests"
          done <<< "$prs"

  # Feature PRs skip the heavy jobs, and a skipped job reports success, so
  # without this a feature PR would show every required check green and
  # could merge untested. Fails on any PR that is not a batch or a release.
  merge-via-batch:
    name: merge via batch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Require a batch or release-please head
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::$HEAD_REPO is a fork: its change lands through a batch/ PR from this repository"
            exit 1
          fi
          case "$HEAD_REF" in
            batch/*|release-please--*) echo "$HEAD_REF may merge" ;;
            *)
              echo "::error::$HEAD_REF is a feature PR: it merges inside a batch/ PR from the merge queue, not on its own"
              exit 1
              ;;
          esac

  # The one check a feature PR gets, on a hosted runner: formatting, so a
  # batch is not cut only to fail on fmt. Clippy and tests run in the batch.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'false'
    steps:
      - uses: actions/checkout@v7
      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    name: build + test + lint
    # Self-hosted home nix builder (host daemon + warm store). Other jobs stay
    # on ubuntu-latest.
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    # Never run fork-PR code on the self-hosted runner (the enforcer's fork-PR
    # approval gate is the primary control; this is a backstop).
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' && github.event.pull_request.head.repo.fork != true }}
    steps:
      - uses: actions/checkout@v7

      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      # The build node's auto-GC deletes any store path nothing roots (B284),
      # and a `nix build --no-link` result has no root, so a job often
      # recompiled all of crates.io that an earlier job had just built.
      # Root the compiled deps in the host's gcroots drop box, which the
      # host daemon can see (a root under the pod's $TMP dangles).
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"

      # One command builds `.#pharos` and runs the WHOLE workspace suite
      # (nextest, `--profile nix` timeouts), clippy (`-D warnings`), rustfmt,
      # and doctests — each a crane flake `check` sharing ONE cached
      # cargoArtifacts, run in PARALLEL by nix. Crucially these test the ACTUAL
      # shipped artifact (same source + toolchain the image is built from), not
      # a separately cargo-built one, and the deps are store-cached instead of
      # recompiled every ephemeral-runner run.
      #
      # T80 — the store suite against a REAL postgres — is `checks.postgres`
      # (`pharosPgTests` in flake.nix), so it runs inside this same command,
      # in parallel with the other checks. The postgres arms skip themselves
      # in the plain workspace nextest (PHAROS_TEST_POSTGRES_URL unset), and
      # sqlx checks neither placeholder arity nor column names at compile
      # time, so that check is what catches a postgres-only defect (e.g. the
      # `mark_seen_batch` override that existed for sqlite only, T117).
      # `just test-postgres` is the local equivalent of the same check.
      - name: nix flake check (build + tests + clippy + fmt + doctests + postgres)
        run: nix flake check -L
      # `checks.workspace-build` and the `oci` job build the same release
      # `pharos`; whichever runs second reuses it only if it survived GC.
      # Root it for this run, and drop this repo's run roots older than 4 h.
      - name: Pin this run's release build against auto-GC
        run: |
          find /nix/var/nix/gcroots/gha -maxdepth 1 -name 'pharos-run-*' -mmin +240 -delete || true
          nix build .#pharos --out-link "/nix/var/nix/gcroots/gha/pharos-run-${GITHUB_RUN_ID}" || echo "::warning::could not pin the release build"
      # Supply-chain checks ride along here rather than in a job of their own:
      # they take ~30 s, and a separate job was another wait for a home runner.
      - name: cargo-audit (RustSec)
        if: ${{ !cancelled() }}
        run: nix develop --command cargo audit
      - name: cargo-deny (licenses + bans)
        if: ${{ !cancelled() }}
        run: nix develop --command cargo deny check

  oci:
    name: package + oci image
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event.pull_request.head.repo.fork != true }}
    # NO `needs: [test]`: this nix build shares nothing with the cargo build in
    # `test`, so gating it behind test only serialised ~4 min after ~3 min. Run
    # it in PARALLEL — `publish` still `needs: [test, oci]`, so a failing test
    # never ships an image. On PRs this is the sole validation that BOTH images
    # (pharos + jellyfin-web) still build. With crane's cached dep artifact,
    # only changed workspace crates recompile here.
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: Pin this run's release build against auto-GC
        run: nix build .#pharos --out-link "/nix/var/nix/gcroots/gha/pharos-run-${GITHUB_RUN_ID}" || echo "::warning::could not pin the release build"
      # Build both images into the (host-shared, warm) nix store. `publish`
      # reuses these exact store paths as instant cache hits — no artifact
      # upload/download round-trip of a ~100 MB tarball.
      - name: Build OCI images
        run: |
          nix build .#oci            --no-link --print-out-paths
          nix build .#jellyfinWebOci --no-link --print-out-paths
          nix build .#alignerOci     --no-link --print-out-paths
          nix build .#alignerRsOci   --no-link --print-out-paths

  publish:
    name: publish images (ghcr)
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes, test, oci]
    # Only on a push that landed on main — PRs build the images (oci job)
    # but must not publish. Consumes the tarballs the `oci` job already built
    # (build-once): no second `nix build`, just download + push.
    # `test` is skipped on a main push whose tree a batch already passed
    # (`changes` above), and a skipped need would skip this job too.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.oci.result == 'success'
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.changes.outputs.tested == 'true')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Push images to GHCR (latest + immutable sha tags)
        env:
          # The workflow token: both GHCR packages grant this repo Write under
          # "Manage Actions access", so no expiring PAT is needed.
          GHCR_CREDS: ${{ github.actor }}:${{ github.token }}
        run: |
          set -euo pipefail
          # Flux image automation orders tags numerically, and a commit SHA
          # doesn't sort. Add a monotonic `main-<commit-unix-ts>-<shortsha>`
          # tag: the timestamp lets the ImagePolicy pick the newest build while
          # the short SHA keeps it traceable. `latest` + full SHA stay for
          # humans / manual pins.
          COMMIT_TS="$(git show -s --format=%ct HEAD)"
          SORTABLE="main-${COMMIT_TS}-${GITHUB_SHA:0:12}"
          # `.#oci` / `.#jellyfinWebOci` are streamLayeredImage SCRIPTS (built by
          # `needs: [oci]` into the warm store → instant cache hits). Each writes
          # the image tar to stdout; stream it ONCE into a local OCI layout, then
          # push every tag from that layout — one assembly per image, no per-tag
          # re-stream, no gzipped store tarball, no artifact round-trip.
          # The store is the host daemon's: its auto-GC can delete any path this
          # pod cannot root (B284). Build each script right before streaming it,
          # and rebuild and re-stream once if a path vanished.
          publish() {
            attr="$1"; repo="$2"
            stage="$(mktemp -d)/img"
            for attempt in 1 2; do
              script="$(nix build ".#${attr}" --no-link --print-out-paths)"
              if "$script" | nix develop --command skopeo --insecure-policy copy \
                   docker-archive:/dev/stdin "oci:${stage}:img"; then
                break
              fi
              present=no; [[ -e "$script" ]] && present=yes
              echo "publish: stream of ${attr} failed, attempt ${attempt}, script ${script} present=${present}" >&2
              [[ $attempt -eq 2 ]] && return 1
              rm -rf "$stage"
            done
            for tag in latest "$GITHUB_SHA" "$SORTABLE"; do
              nix develop --command skopeo --insecure-policy copy \
                --dest-creds "$GHCR_CREDS" \
                "oci:${stage}:img" "docker://${repo}:${tag}"
            done
          }
          publish oci            ghcr.io/alisonjenkins/pharos
          publish jellyfinWebOci ghcr.io/alisonjenkins/pharos-jellyfin-web

          # The aligner images are GBs and change rarely, so each is tagged
          # by its script's store hash and streamed only when that tag is
          # missing; the chart pins the tag (aligner.image.tag).
          # Rooted in the host's gcroots drop box: the `nix develop` of the
          # tag check below can start an auto-GC that deletes an unrooted
          # script before it is streamed (B628).
          publish_by_hash() { # <flake output> <repository> <gcroot name>
            local script tag stage
            script="$(nix build ".#$1" --print-out-paths \
              --out-link "/nix/var/nix/gcroots/gha/$3")"
            tag="$(basename "$script" | cut -d- -f1)"
            if nix develop --command skopeo inspect --creds "$GHCR_CREDS" \
                 "docker://$2:${tag}" >/dev/null 2>&1; then
              echo "publish: $2:${tag} already published"
              return
            fi
            stage="$(mktemp -d)/img"
            "$script" | nix develop --command skopeo --insecure-policy copy \
              docker-archive:/dev/stdin "oci:${stage}:img"
            for t in latest "$tag"; do
              nix develop --command skopeo --insecure-policy copy \
                --dest-creds "$GHCR_CREDS" \
                "oci:${stage}:img" "docker://$2:${t}"
            done
            rm -rf "$(dirname "$stage")"
            echo "publish: $2:${tag} pushed"
          }
          # ADR-0066, the Python aligner.
          publish_by_hash alignerOci ghcr.io/alisonjenkins/pharos-aligner pharos-aligner-oci
          # Spec 039, the Rust aligner, under its own name until the cutover.
          publish_by_hash alignerRsOci ghcr.io/alisonjenkins/pharos-aligner-rs pharos-aligner-rs-oci

  compat-playwright:
    name: jellyfin-web crawl
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' && github.event.pull_request.head.repo.fork != true }}
    # NO `needs: [test]`. This job builds what it needs through `just`, so
    # nothing it does depends on the flake check having passed — waiting for
    # it only serialised ~2m45s onto the end of every PR run (measured: the
    # crawl is consistently the LAST job to finish, and is what sets the PR's
    # total wall clock). `publish` still needs `test`, so a failing check
    # cannot ship an image regardless of what this job does.
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: npm install
        run: nix develop --command bash -c 'cd compat-playwright && npm install --no-audit --no-fund'
      # Browser binaries come from the nix-pinned playwright-driver
      # (PLAYWRIGHT_BROWSERS_PATH, exported by the devShell). No
      # `npx playwright install` — the @playwright/test version is pinned
      # to match playwright-driver so the store path has the right rev.
      # `pharosTestBins` reuses the flake check's `ci`-profile deps from the
      # shared store, so only the workspace crates compile, instead of a cold
      # `cargo build` of the whole tree in this job.
      - name: Build pharos test binaries
        run: |
          out="$(nix build .#pharosTestBins --no-link --print-out-paths)"
          echo "PHAROS_BIN_DIR=$out/bin" >> "$GITHUB_ENV"
      - name: Run Playwright crawl
        run: nix develop --command bash -c 'just compat-playwright-full'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: compat-playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Dioxus UI suite. The native-on run is most of it and took ~25 min on one
  # worker, the longest step of a batch's CI, while the other runners sat
  # idle once test and the crawl were done. It is split into shards, each a
  # job with its own seeded pharos (`PLAYWRIGHT_SHARD`, see
  # `just compat-dioxus-full`), so the shards share no state. The native-off
  # run and the TV type-check share a job. `dioxus UI` below gathers them
  # under the one check name the PRs have always reported.
  dioxus-ui-on:
    name: dioxus UI (native on ${{ matrix.shard }}/3)
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' && github.event.pull_request.head.repo.fork != true }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: npm install
        run: nix develop --command bash -c 'cd compat-playwright && npm install --no-audit --no-fund'
      # The crawl's binaries, from the shared store: no cold `cargo build`
      # in each shard. Rooted in the host's gcroots drop box: the recipe
      # builds the UI bundle and test media before it copies the binaries,
      # and the host's auto-GC can delete an unrooted path meanwhile (B284).
      # The `pharos-run-*` name is swept after 4 h by the test job.
      - name: Build pharos test binaries
        run: |
          out="$(nix build .#pharosTestBins --out-link "/nix/var/nix/gcroots/gha/pharos-run-${GITHUB_RUN_ID}-bins-dioxus-on-${{ matrix.shard }}" --print-out-paths)" \
            || { echo "::warning::could not root the test binaries"; out="$(nix build .#pharosTestBins --no-link --print-out-paths)"; }
          echo "PHAROS_BIN_DIR=$out/bin" >> "$GITHUB_ENV"
      - name: Run Dioxus UI suite (native on, shard ${{ matrix.shard }}/3)
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/3
        run: nix develop --command bash -c 'just compat-dioxus-full on'
      - name: Upload Dioxus UI artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dioxus-ui-native-on-${{ matrix.shard }}-${{ github.sha }}
          path: |
            compat-playwright/test-results
            compat-playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  dioxus-ui-off:
    name: dioxus UI (native off + TV type-check)
    runs-on: pharos-nix-builder-amd64
    timeout-minutes: 120
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' && github.event.pull_request.head.repo.fork != true }}
    steps:
      - uses: actions/checkout@v7
      - uses: alisonjenkins/setup-host-nix@v1.0.1
        with:
          max-jobs: 2
          cores: 16
      - name: Pin compiled deps against auto-GC
        run: nix build .#ciWarmRoots --out-link /nix/var/nix/gcroots/gha/pharos-ci-warm-roots || echo "::warning::could not pin compiled deps"
      - name: npm install
        run: nix develop --command bash -c 'cd compat-playwright && npm install --no-audit --no-fund'
      - name: Build pharos test binaries
        run: |
          out="$(nix build .#pharosTestBins --out-link "/nix/var/nix/gcroots/gha/pharos-run-${GITHUB_RUN_ID}-bins-dioxus-off" --print-out-paths)" \
            || { echo "::warning::could not root the test binaries"; out="$(nix build .#pharosTestBins --no-link --print-out-paths)"; }
          echo "PHAROS_BIN_DIR=$out/bin" >> "$GITHUB_ENV"
      - name: Run Dioxus UI suite (native off)
        id: native-off
        run: nix develop --command bash -c 'just compat-dioxus-full off'
      - name: Upload Dioxus UI artifacts (native off) on failure
        if: ${{ !cancelled() && steps.native-off.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: dioxus-ui-native-off-${{ github.sha }}
          path: |
            compat-playwright/test-results
            compat-playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      # B1333/V1304: the TV app's Android-only modules compile under no
      # other build, so a shared signature change broke the TV line with
      # every other check green. Last, and whatever the suite did, so both
      # results show either way.
      - name: Type-check the TV app (mobile feature, armv7 Android)
        if: ${{ !cancelled() }}
        run: nix develop --command just tv-check

  # The single `dioxus UI` check, as before the split, so a required-check
  # rule or a reader keyed on that name still sees one result. It passes when
  # every part passed, or when the parts were skipped because this run needs
  # no heavy jobs or its tree already passed as a batch (a skipped job reports success, as before; `merge via
  # batch` is what stops a feature PR merging).
  dioxus-ui:
    name: dioxus UI
    runs-on: ubuntu-latest
    needs: [changes, dioxus-ui-on, dioxus-ui-off]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every Dioxus UI part to pass
        env:
          CODE: ${{ needs.changes.outputs.code }}
          TESTED: ${{ needs.changes.outputs.tested }}
          ON: ${{ needs.dioxus-ui-on.result }}
          OFF: ${{ needs.dioxus-ui-off.result }}
        run: |
          echo "code=$CODE tested=$TESTED native-on=$ON native-off+tv=$OFF"
          for part in "native-on=$ON" "native-off+tv=$OFF"; do
            result="${part#*=}"
            if [[ "$result" == success ]]; then continue; fi
            if [[ "$result" == skipped && ( "$CODE" == false || "$TESTED" == true ) ]]; then continue; fi
            echo "::error::dioxus UI part ${part%%=*} ended ${result}"
            exit 1
          done
