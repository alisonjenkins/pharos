{{- /*
One aligner Deployment and its Service. Called with a dict: `root` (the
chart context), `suffix` (the name after the release's fullname), `cfg` (the
aligner or aligner.shadow values) and `component`.
*/ -}}
{{- define "pharos.aligner.workload" -}}
{{- $root := .root }}
{{- $cfg := .cfg }}
{{- $name := printf "%s-%s" (include "pharos.fullname" $root) .suffix }}
{{- /* The primary keeps the selector it always had (selectors are immutable);
the shadow's name differs, so neither Service selects the other's pods. */}}
{{- $selector := include "pharos.aligner.selectorLabels" $root }}
{{- if ne .suffix "aligner" }}
{{- $selector = printf "app.kubernetes.io/name: %s-%s\napp.kubernetes.io/instance: %s" (include "pharos.name" $root) .suffix $root.Release.Name }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  replicas: 1
  {{- if or $cfg.gpu.enabled $cfg.cache.enabled }}
  # The running pod holds the render node and the ReadWriteOnce cache claim;
  # a surge pod could wait on either, so the old pod stops first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
    spec:
      {{- with $root.Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- $psc := deepCopy $root.Values.podSecurityContext }}
        {{- if and $cfg.gpu.enabled $cfg.gpu.supplementalGroups }}
        {{- /* The render node's group, so the non-root user may open it. */}}
        {{- $_ := set $psc "supplementalGroups" $cfg.gpu.supplementalGroups }}
        {{- end }}
        {{- toYaml $psc | nindent 8 }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aligner
          image: "{{ $cfg.image.repository }}:{{ required (printf "%s image.tag is required when it is enabled" .suffix) $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          env:
            - name: PHAROS_ALIGNER_MEDIA_ROOT
              value: /var/lib/pharos/media
            - name: PHAROS_ALIGNER_LISTEN
              value: "0.0.0.0:{{ $root.Values.aligner.port }}"
            {{- with $cfg.device }}
            # Spec 039, R10: auto, vulkan or cpu. The Python image ignores it.
            - name: PHAROS_ALIGNER_DEVICE
              value: {{ . | quote }}
            {{- end }}
            {{- if $root.Values.config.obs.otlpEndpoint }}
            # ADR-0105: the aligner's spans join the server's trace in Tempo.
            - name: PHAROS_ALIGNER_OTLP_ENDPOINT
              value: {{ $root.Values.config.obs.otlpEndpoint | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $root.Values.aligner.port }}
              protocol: TCP
          # The Rust image warms every GPU window length before it binds the
          # port (10 s on a kept cache, ~40 s cold, longer on a slow device),
          # so the startup probe allows 10 minutes and holds off the liveness
          # probe until /healthz first answers.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- $res := deepCopy $cfg.resources }}
            {{- if $cfg.gpu.enabled }}
            {{- /* The render node from the device plugin, merged into the limits. */}}
            {{- $limits := default dict $res.limits }}
            {{- $_ := set $limits $cfg.gpu.resourceName $cfg.gpu.count }}
            {{- $_ := set $res "limits" $limits }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /var/lib/pharos/media
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $cfg.cache.enabled }}
            - name: kernel-cache
              mountPath: /var/cache/pharos-aligner
            {{- end }}
      volumes:
        - name: media
          {{- include "pharos.mediaVolume" $root | trim | nindent 10 }}
        - name: tmp
          emptyDir: {}
        {{- if $cfg.cache.enabled }}
        # Spec 039, R14: compiled GPU kernels, kept across restarts.
        - name: kernel-cache
          persistentVolumeClaim:
            claimName: {{ $name }}-cache
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  type: ClusterIP
  selector:
    {{- $selector | nindent 4 }}
  ports:
    - name: http
      port: {{ $root.Values.aligner.port }}
      targetPort: http
      protocol: TCP
{{- if $cfg.cache.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-cache
  labels:
    {{- include "pharos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $cfg.cache.size | quote }}
  {{- with $cfg.cache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end -}}

{{- if .Values.aligner.enabled }}
# pharos-aligner (ADR-0066, spec 039): word times for karaoke by forced
# alignment. The server sends it a song's path under the media mount, so both
# pods mount the same media at the same path.
{{ include "pharos.aligner.workload" (dict "root" . "suffix" "aligner" "cfg" .Values.aligner "component" "aligner") }}
{{- end }}
{{- if and .Values.aligner.enabled .Values.aligner.shadow.enabled }}
---
# Spec 039, R21: a second aligner that sees every finished song after the
# primary answers, for a word-by-word comparison. Its answers are never
# stored or served.
{{ include "pharos.aligner.workload" (dict "root" . "suffix" "aligner-shadow" "cfg" .Values.aligner.shadow "component" "aligner-shadow") }}
{{- end }}
