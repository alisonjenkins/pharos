{{- /*
selfHeal: a CronJob that rolls out a fresh pod for each of this release's
Deployments labelled pharos.io/self-heal=true whose pod has stayed NotReady
too long, as `kubectl rollout restart` does. A failing readiness probe only
takes a pod out of its Service, and a failing liveness probe only restarts
the container; neither replaces a pod-level fault such as a stale NFS mount,
which belongs to the pod. The rollout follows the Deployment's own strategy:
RollingUpdate starts the new pod before the old one stops, Recreate stops
the old one first. Only pods whose containers have all started (so past the
startup probe) are counted.
*/ -}}
{{- if .Values.selfHeal.enabled }}
{{- /* A CronJob name may be at most 52 characters: its Jobs append an
11-character suffix to it. */ -}}
{{- $name := printf "%s-self-heal" (include "pharos.fullname" . | trunc 42 | trimSuffix "-") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # patch: the reaper stamps when it first saw a pod NotReady.
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # patch: the restartedAt annotation that rolls out a fresh pod.
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
spec:
  schedule: {{ .Values.selfHeal.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "pharos.name" . }}-self-heal
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: self-heal
              image: {{ .Values.selfHeal.image | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: SELECTOR
                  value: "app.kubernetes.io/instance={{ .Release.Name }},pharos.io/self-heal=true"
                - name: NOT_READY_SECONDS
                  value: {{ mul (int .Values.selfHeal.notReadyMinutes) 60 | quote }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  now="$(date +%s)"
                  # A new pod's Ready condition is False from before its startup probe
                  # passed, so its transition time cannot say how long readiness has
                  # failed. The reaper stamps the time it first sees a started pod
                  # NotReady and counts from that stamp. A Ready transition newer than
                  # the stamp (the pod recovered and failed again), or a container
                  # restart since the stamp (its startup runs again), starts a new
                  # count. The stamp is "<unix seconds>/<containers>", containers
                  # being the first 12 characters of each container's ID: a
                  # replaced container has a new ID even where its restart count
                  # was reset, as after a node restart that lost kubelet state.
                  key=pharos.io/not-ready-since
                  restarted_key=kubectl.kubernetes.io/restartedAt
                  kubectl get deployments -n "$NAMESPACE" -l "$SELECTOR" -o json |
                    jq -r --arg key "$restarted_key" '
                      .items[]
                      | ((.spec.template.metadata.annotations // {})[$key] // "") as $at
                      | (if $at == "" then 0 else (try ($at | fromdateiso8601) catch 0) end) as $restarted
                      | (.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")) as $pods
                      | "\(.metadata.name) \($restarted) \($pods)"' |
                    while read -r deploy restarted pods; do
                      # One rollout at a time: a pod this reaper rolled out gets the
                      # whole limit to become Ready before it is judged again.
                      if [ $((now - restarted)) -lt "$NOT_READY_SECONDS" ]; then
                        echo "self-heal: waiting deployment=$deploy restarted_s=$((now - restarted))"
                        continue
                      fi
                      stale=""
                      while read -r pod since changed containers; do
                        if [ "$since" -lt "$changed" ]; then
                          echo "self-heal: watching pod=$pod not_ready_since=$now containers=$containers"
                          kubectl annotate pod -n "$NAMESPACE" "$pod" --overwrite "$key=$now/$containers" >/dev/null
                        elif [ $((now - since)) -gt "$NOT_READY_SECONDS" ] && [ -z "$stale" ]; then
                          stale="$pod $((now - since))"
                        fi
                      done < <(kubectl get pods -n "$NAMESPACE" -l "$pods" -o json |
                        jq -r --arg key "$key" '
                          .items[]
                          | select(.metadata.deletionTimestamp == null)
                          | select(.status.phase == "Running")
                          | select((.status.containerStatuses // []) | length > 0 and all(.started == true))
                          | ((.status.conditions // []) | map(select(.type == "Ready")) | first) as $ready
                          | select($ready != null and $ready.status == "False")
                          | ([.status.containerStatuses[].containerID // "none"
                              | sub("^[a-z]+://"; "") | .[0:12]] | join(",")) as $containers
                          | ((.metadata.annotations // {})[$key] // "" | split("/")) as $stamp
                          | ((($stamp[0] // "0") | tonumber?) // 0) as $since
                          | (if ($stamp[1] // "") == $containers then $since else 0 end) as $since
                          | "\(.metadata.name) \($since) \($ready.lastTransitionTime | fromdateiso8601) \($containers)"')
                      if [ -n "$stale" ]; then
                        read -r pod seconds <<<"$stale"
                        echo "self-heal: restarting deployment=$deploy pod=$pod not_ready_s=$seconds limit_s=$NOT_READY_SECONDS"
                        kubectl patch deployment -n "$NAMESPACE" "$deploy" --type merge \
                          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"$restarted_key\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}}}" >/dev/null
                      fi
                    done
                  echo "self-heal: checked selector=$SELECTOR"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.selfHeal.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
