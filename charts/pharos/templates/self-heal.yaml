{{- /*
selfHeal: a CronJob that deletes this release's pods which have stayed
NotReady too long, so their Deployment makes new ones. A failing readiness
probe only takes a pod out of its Service, and a failing liveness probe only
restarts the container; neither replaces a pod-level fault such as a stale
NFS mount, which belongs to the pod. Only pods labelled
pharos.io/self-heal=true whose containers have all started (so past the
startup probe) are candidates.
*/ -}}
{{- if .Values.selfHeal.enabled }}
{{- /* A CronJob name may be at most 52 characters: its Jobs append an
11-character suffix to it. */ -}}
{{- $name := printf "%s-self-heal" (include "pharos.fullname" . | trunc 42 | trimSuffix "-") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # patch: the reaper stamps when it first saw a pod NotReady.
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
spec:
  schedule: {{ .Values.selfHeal.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "pharos.name" . }}-self-heal
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: self-heal
              image: {{ .Values.selfHeal.image | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: SELECTOR
                  value: "app.kubernetes.io/instance={{ .Release.Name }},pharos.io/self-heal=true"
                - name: NOT_READY_SECONDS
                  value: {{ mul (int .Values.selfHeal.notReadyMinutes) 60 | quote }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  now="$(date +%s)"
                  # A new pod's Ready condition is False from before its startup probe
                  # passed, so its transition time cannot say how long readiness has
                  # failed. The reaper stamps the time it first sees a started pod
                  # NotReady and counts from that stamp. A Ready transition newer than
                  # the stamp (the pod recovered and failed again), or a container
                  # restart since the stamp (its startup runs again), starts a new
                  # count. The stamp is "<unix seconds>/<restarts>", restarts being
                  # the sum of the pod's container restart counts.
                  key=pharos.io/not-ready-since
                  kubectl get pods -n "$NAMESPACE" -l "$SELECTOR" -o json |
                    jq -r --arg key "$key" '
                      .items[]
                      | select(.metadata.deletionTimestamp == null)
                      | select(.status.phase == "Running")
                      | select((.status.containerStatuses // []) | length > 0 and all(.started == true))
                      | ((.status.conditions // []) | map(select(.type == "Ready")) | first) as $ready
                      | select($ready != null and $ready.status == "False")
                      | ([.status.containerStatuses[].restartCount // 0] | add) as $restarts
                      | ((.metadata.annotations // {})[$key] // "" | split("/")) as $stamp
                      | ((($stamp[0] // "0") | tonumber?) // 0) as $since
                      | ((($stamp[1] // "-1") | tonumber?) // -1) as $stamped_restarts
                      | (if $stamped_restarts == $restarts then $since else 0 end) as $since
                      | "\(.metadata.name) \($since) \($ready.lastTransitionTime | fromdateiso8601) \($restarts)"' |
                    while read -r pod since changed restarts; do
                      if [ "$since" -lt "$changed" ]; then
                        echo "self-heal: watching pod=$pod not_ready_since=$now restarts=$restarts"
                        kubectl annotate pod -n "$NAMESPACE" "$pod" --overwrite "$key=$now/$restarts" >/dev/null
                      elif [ $((now - since)) -gt "$NOT_READY_SECONDS" ]; then
                        echo "self-heal: deleting pod=$pod not_ready_s=$((now - since)) limit_s=$NOT_READY_SECONDS"
                        kubectl delete pod -n "$NAMESPACE" "$pod" --wait=false
                      fi
                    done
                  echo "self-heal: checked selector=$SELECTOR"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.selfHeal.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
