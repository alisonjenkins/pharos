{{- /*
selfHeal: a CronJob that deletes this release's pods which have stayed
NotReady too long, so their Deployment makes new ones. A failing readiness
probe only takes a pod out of its Service, and a failing liveness probe only
restarts the container; neither replaces a pod-level fault such as a stale
NFS mount, which belongs to the pod. Only pods labelled
pharos.io/self-heal=true whose containers have all started (so past the
startup probe) are candidates.
*/ -}}
{{- if .Values.selfHeal.enabled }}
{{- $name := printf "%s-self-heal" (include "pharos.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharos.labels" . | nindent 4 }}
    app.kubernetes.io/component: self-heal
spec:
  schedule: {{ .Values.selfHeal.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "pharos.name" . }}-self-heal
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: self-heal
              image: {{ .Values.selfHeal.image | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: SELECTOR
                  value: "app.kubernetes.io/instance={{ .Release.Name }},pharos.io/self-heal=true"
                - name: NOT_READY_SECONDS
                  value: {{ mul (int .Values.selfHeal.notReadyMinutes) 60 | quote }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  now="$(date +%s)"
                  kubectl get pods -n "$NAMESPACE" -l "$SELECTOR" -o json |
                    jq -r --argjson now "$now" --argjson limit "$NOT_READY_SECONDS" '
                      .items[]
                      | select(.metadata.deletionTimestamp == null)
                      | select(.status.phase == "Running")
                      | select((.status.containerStatuses // []) | length > 0 and all(.started == true))
                      | ((.status.conditions // []) | map(select(.type == "Ready")) | first) as $ready
                      | select($ready != null and $ready.status != "True")
                      | ($now - ($ready.lastTransitionTime | fromdateiso8601)) as $for
                      | select($for > $limit)
                      | "\(.metadata.name) \($for)"' |
                    while read -r pod seconds; do
                      echo "self-heal: deleting pod=$pod not_ready_s=$seconds limit_s=$NOT_READY_SECONDS"
                      kubectl delete pod -n "$NAMESPACE" "$pod" --wait=false
                    done
                  echo "self-heal: checked selector=$SELECTOR"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.selfHeal.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
