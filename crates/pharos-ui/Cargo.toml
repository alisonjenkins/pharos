[package]
name = "pharos-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enable the `[[bin]] web` target — adds the wasm renderer + gloo-net
# HTTP client. Build with `dx serve` or
# `cargo build --target wasm32-unknown-unknown --bin pharos-ui-web --features web`.
web = [
    "dep:dioxus-web",
    "dep:gloo-net",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:getrandom02",
    "dep:quire-web",
]

# 025: the Android TV app (`nix run .#android-apk`, or `dx build --platform
# android --package pharos-ui --bin pharos-tv --features mobile`).
mobile = ["dioxus/mobile", "dioxus/launch", "dioxus/document"]

[[bin]]
name = "pharos-tv"
path = "src/bin/tv.rs"
required-features = ["mobile"]

[[bin]]
name = "pharos-ui-web"
path = "src/bin/web.rs"
required-features = ["web"]

[dependencies]
dioxus.workspace = true
dioxus-web = { workspace = true, optional = true }
futures-util = "0.3"
gloo-net = { workspace = true, optional = true }
# Pulled in by the `web` feature so PlayerView's wasm path can read
# `<video>.currentTime` from the underlying `web_sys::HtmlMediaElement`.
# Host-side tests compile without them via cfg-gating in the source.
web-sys = { version = "0.3", optional = true, features = [
    "HtmlMediaElement",
    "HtmlVideoElement",
    "VideoPlaybackQuality",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Event",
    "EventTarget",
    "Element",
    "Window",
    "Document",
    "Storage",
    "Location",
    "Performance",
    "Crypto",
    "History",
    "AddEventListenerOptions",
    "HtmlHeadElement",
    "HtmlScriptElement",
    "MediaError",
    "MediaSource",
    "SourceBuffer",
    "SourceBufferList",
    "AbortController",
    "AbortSignal",
    "MediaSourceReadyState",
    "MediaQueryList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "WebglLoseContext",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioDestinationNode",
    "AnalyserNode",
    "MediaElementAudioSourceNode",
    "TimeRanges",
    "CssStyleDeclaration",
    "Navigator",
    "DomRect",
    "HtmlInputElement",
    "File",
    "FileList",
    "console",
    "TextTrack",
    "TextTrackList",
    "TextTrackMode",
    "IntersectionObserver",
    "WheelEvent",
    "PointerEvent",
    "Selection",
    "ScrollToOptions",
    "ScrollBehavior",
    "DomTokenList",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "HtmlCollection",
    "IntersectionObserverEntry",
    "DomRect",
    "ImageBitmap",
    "CanvasRenderingContext2d",
    "ImageData",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "ServiceWorker",
    "MessageEvent",
    "Cache",
    "CacheStorage",
    "Response",
    "StorageManager",
] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# wasm32 has no default getrandom backend; dioxus 0.7's dep graph pulls
# getrandom 0.2 transitively, so force its `js` feature for the web build.
# Pinned to 0.2: 0.3+ replaced `js` with `wasm_js` and would not unify with
# the transitive copy.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
pharos-client = { path = "../pharos-client" }
# 026: the pure-Rust subtitle renderer behind the SubtitleRenderer port.
pharos-subs = { path = "../pharos-subs" }
pharos-hls = { path = "../pharos-hls" }
# 023: the book model (locators, table of contents) and, in the browser build,
# its renderer. Neither knows pharos (V350).
quire = { path = "../quire" }
quire-web = { path = "../quire-web", optional = true }
serde = { workspace = true }
serde_json.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "std"] }
thiserror.workspace = true
# NOTE: pharos-ui deliberately does NOT depend on workspace-hack — it builds
# for wasm32 and the hack pulls the native-only stack (sqlx/tokio/mio). It is
# listed under [final-excludes] in .config/hakari.toml so CI's hakari-check
# does not try to re-add the dependency.

# 025: the Android TV app's native link to the server (native/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
pharos-api = { path = "../pharos-api", features = ["rustls-client"] }
capnp = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3"
android_logger = "0.15"
# Back at the first page sends the app to the background (native/android_page.rs).
jni = "0.21"
ndk-context = "0.1"
# The server proxy (native/android_page.rs): images and streams with the token in a header.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
log = "0.4"

[dev-dependencies]
# T51 phase 1: dioxus-ssr renders components to HTML strings inside
# `#[test]`s so we can assert structural landmarks (input #ids,
# button text, expected error branches) without a browser. Lives at
# the same major version as the main `dioxus` workspace dep.
dioxus-ssr = "=0.8.0-alpha.3"
# V530: reads the shipped subtitle fonts' family names in a test.
skrifa = "0.49"

[lints]
workspace = true
