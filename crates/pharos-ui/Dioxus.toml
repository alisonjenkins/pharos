[application]
name = "pharos-ui"
# 025 spike: TV entries (LEANBACK_LAUNCHER, banner, touchscreen optional).
android_manifest = "android/AndroidManifest.xml"

[web.app]
# title lives in index.html (setting it here too double-renders it).
default_platform = "web"
# pharos serves the bundle under /ui/ (ADR-0038); this prefixes the URLs dx
# writes into index.html and must match `route::MOUNT`.
base_path = "ui"

[web.watcher]
reload_html = true
watch_path = ["src", "index.html", "assets"]

[web.resource]
# Stylesheet is linked directly in index.html (absolute, so it resolves
# from any route); listing it here too would double-inject the link.
style = []
script = []
# dev-only resources (required field; empty in release).
dev = []

[bundle.web]
out_dir = "target/dx/pharos-ui/release/web"

# 025 slice 0 spike: the Android TV app.
[bundle]
identifier = "com.alisonjenkins.pharos.tv"
publisher = "pharos"
