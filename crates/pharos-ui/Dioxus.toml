[application]
name = "pharos-ui"

[web.app]
# title lives in index.html (setting it here too double-renders it).
default_platform = "web"
# Served at the root by pharos itself (spec 009 contracts/serving.md); the
# server redirects the old /ui/ mount here.

[web.watcher]
reload_html = true
watch_path = ["src", "index.html", "assets"]

[web.resource]
# Stylesheet is linked directly in index.html (absolute, so it resolves
# from any route); listing it here too would double-inject the link.
style = []
script = []
# dev-only resources (required field; empty in release).
dev = []

[bundle.web]
out_dir = "target/dx/pharos-ui/release/web"
