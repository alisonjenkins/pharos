[package]
name = "pharos-vis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Decodes a song just ahead of the playhead into visualiser frames (ADR-0133)"

[dependencies]
log = "0.4"
realfft = "3"
thiserror = { workspace = true }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "wav", "alac", "pcm"] }

[dev-dependencies]
# Holds the wire constants the page decodes with to this crate's own.
pharos-ui = { path = "../pharos-ui" }

[lints]
workspace = true
