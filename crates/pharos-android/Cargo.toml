[package]
name = "pharos-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Rust side of the Pharos Android app: media service, session, player and car voice (spec 044)"

[lib]
crate-type = ["rlib"]

[dependencies]
jni = "0.21.1"
log = "0.4"
pharos-content = { path = "../pharos-content" }

[lints]
workspace = true

[features]
# The Test folder of generated tones the host JVM check plays; never in an
# app build.
test-catalogue = []

[[example]]
name = "jvm_check_lib"
crate-type = ["cdylib"]
required-features = ["test-catalogue"]
