[package]
name = "pharos-subs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure-Rust subtitle renderer (SRT, WebVTT, ASS/SSA) producing alpha masks"

# Deliberately no workspace-hack: it unifies native-only features (tokio/mio)
# that do not compile for wasm32. See .config/hakari.toml final-excludes.
[dependencies]
encoding_rs = { version = "0.8", optional = true }
harfrust = "0.15"
skrifa = "0.49"
unicode-bidi = { version = "0.3", default-features = false, features = ["std", "hardcoded-data"] }
unicode-linebreak = "0.1"

[features]
# Legacy codepage decoding for sidecar files that are not UTF-8.
legacy-encodings = ["dep:encoding_rs"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
