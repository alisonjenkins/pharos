[package]
name = "pharos-align"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CTC forced alignment of lyric words to MMS_FA emissions, matching the Python aligner"

[features]
vulkan = ["dep:burn", "dep:wgpu", "dep:pollster"]

[dependencies]
# The GPU forward pass: wgpu on Vulkan only (spec 039, R9).
burn = { version = "0.22.1", default-features = false, features = ["std", "vulkan", "fusion", "autotune"], optional = true }
# Listing adapters for the device choice; the versions Burn already pulls in.
wgpu = { version = "30", default-features = false, optional = true }
pollster = { version = "0.4", optional = true }
actix-web.workspace = true
gemm = "0.19"
memmap2 = "0.9"
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-process.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
libc = "0.2"
rayon = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
unicode-normalization = "0.1"
wait-timeout = "0.2"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[build-dependencies]
pkg-config = "0.3"

[lints]
workspace = true
