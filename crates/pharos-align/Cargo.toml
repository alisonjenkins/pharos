[package]
name = "pharos-align"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CTC forced alignment of lyric words to MMS_FA emissions, matching the Python aligner"

[features]
vulkan = ["dep:burn", "dep:wgpu", "dep:pollster", "dep:cubecl-runtime"]
# The recogniser (spec 042 slice 2, ADR-0125): whisper.cpp on Vulkan.
recognise = ["dep:whisper-rs"]
# The vocal separator (spec 042 slice 3, ADR-0125): htdemucs converted to
# Burn by the flake, which exports PHAROS_SEPARATOR_MODEL.
separate = ["vulkan", "dep:burn-store"]

[dependencies]
# The GPU forward pass: wgpu on Vulkan only (spec 039, R9).
burn = { version = "0.22.1", default-features = false, features = ["std", "vulkan", "fusion", "autotune", "persistence"], optional = true }
# Its kernel cache settings (R20); the version Burn already pulls in.
cubecl-runtime = { version = "0.11.4", default-features = false, features = ["std", "persistence"], optional = true }
# Listing adapters for the device choice; the versions Burn already pulls in.
wgpu = { version = "30", default-features = false, optional = true }
pollster = { version = "0.4", optional = true }
# Loads the separator's burnpack weights; the version Burn already pulls in.
burn-store = { version = "0.22.1", default-features = false, features = ["std", "memmap"], optional = true }
# Pinned: the decode settings in `recognise` were measured on this release.
whisper-rs = { version = "=0.16.0", features = ["vulkan"], optional = true }
actix-web.workspace = true
gemm = "0.19"
memmap2 = "0.9"
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-process.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
libc = "0.2"
rayon = "1"
# htdemucs's spectrogram (spec 042 slice 3); the release already in the lock.
realfft = "3.5"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
unicode-normalization = "0.1"
wait-timeout = "0.2"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[build-dependencies]
pkg-config = "0.3"

[lints]
workspace = true

[dev-dependencies]
metrics-util.workspace = true

[[example]]
name = "recognise"
required-features = ["recognise"]

[[example]]
name = "separate"
required-features = ["separate"]
