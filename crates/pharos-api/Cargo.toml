[package]
name = "pharos-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
capnp = { workspace = true }
capnp-rpc = { workspace = true }
metrics = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
# The rustls client config native clients share (pharos-server's outbound
# HTTP, the Android TV app's server proxy). Off by default: the wasm UI
# build never needs it.
rustls-client = ["dep:rustls", "dep:webpki-roots"]

[build-dependencies]
capnp = { workspace = true }
capnpc = { workspace = true }

[dev-dependencies]
metrics-util = { workspace = true }
pharos-test-metrics = { path = "../pharos-test-metrics" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
