# cargo-audit configuration.
# Keep `ignore` in sync with the matching list in `/deny.toml`.

[advisories]
ignore = [
    # RUSTSEC-2025-0141 — bincode 1.3.3 unmaintained (not a vuln). Used
    # only for the internal scheduler<->worker control-frame protocol; the
    # team consider 1.3.3 complete and there's no safe upgrade. Matches
    # the rationale in deny.toml.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0194 / -0195 — quadratic duplicate-attribute check and
    # unbounded `NsReader` namespace allocation in quick-xml < 0.41. Both
    # come from the 0.39 that `boko` pins; pharos's own quick-xml is 0.41,
    # and 0.39 -> 0.41 is a breaking range for a 0.x crate, so this needs an
    # upstream release rather than a `cargo update`.
    #
    # Ignored on reachability, and the two are unreachable for DIFFERENT
    # reasons — -0195 needs `NsReader`, which boko never constructs, while
    # -0194 applies to the plain `Reader` boko does use but lives in its EPUB
    # *importer*, which pharos never enters because it hands boko only
    # `.mobi`/`.azw`/`.azw3`. The full argument, including what would
    # invalidate it, is in deny.toml; V123 says it has to be written down.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RUSTSEC-2026-0258 — unbounded empty DATA frames in `h2` < 0.4.16, fixed
    # only on the 0.4 line. h2 0.3.27 is compiled into the server through
    # actix-http's `http2` feature (required by the awc / actix-test
    # dev-dependencies and unified into workspace-hack), but the listener is
    # bound with `.bind()`, which actix-http documents as HTTP/1.x only, so the
    # h2 server path is unreachable. Full argument in deny.toml.
    "RUSTSEC-2026-0258",
    # RUSTSEC-2026-0367 / -0368 / -0369 — zip 8.6.0 `extract()` advisories
    # (SUID/SGID kept, symlink escape). zip 8.6.0 is pinned by `boko`, which
    # never calls `extract()`; no fixed 8.x exists. Full argument in deny.toml.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
