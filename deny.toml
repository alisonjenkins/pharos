# cargo-deny config — supply-chain guardrails for pharos.
# Invoke via `just audit` or `nix develop --command cargo deny check`.
#
# Three checks live here: advisories (RustSec), bans (banned crates +
# duplicate-version policy), and licenses (allowed set, with a small
# exception list for transitive deps we can't avoid).

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack on the `rsa` crate. Pulled in
    # transitively by sqlx-mysql via sqlx-macros-core (the proc-macro
    # crate hard-deps every driver). Pharos never enables the mysql
    # feature on sqlx and never uses RSA in any code path, so this is
    # not reachable in our compiled binary. Re-evaluate when sqlx ships
    # a fix or moves to a non-affected RSA impl.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0141 — `bincode` 1.3.3 is "unmaintained", not
    # vulnerable: the team ceased development after a harassment incident
    # and consider 1.3.3 a complete, stable release. We use it only for
    # the internal length-prefixed control-frame protocol between the
    # transcode scheduler and its workers (never on untrusted external
    # input). No safe upgrade exists (bincode 2.x is a different API).
    # Re-evaluate if we migrate the framing to postcard.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0194 (quadratic duplicate-attribute check) and
    # RUSTSEC-2026-0195 (unbounded namespace-declaration allocation in
    # `NsReader`), both in `quick-xml` < 0.41.
    #
    # pharos is already on 0.41 (workspace manifest). These hit ONLY the copy
    # `boko` 0.5.0 pins at `0.39`, and `cargo update` cannot lift it: for a 0.x
    # crate, 0.39 → 0.41 is a breaking range, so the fix needs an upstream
    # release. Ignored on REACHABILITY, and the two differ:
    #
    # * 0195 needs `NsReader` / `NamespaceResolver`, of which boko contains
    #   zero uses — every parse goes through `Reader::from_str`. (Checked by
    #   name: the `read_resolved`-shaped hits in that crate are
    #   `resolve_element_role`, a KFX schema helper with no XML involvement.)
    #
    # * 0194 is the one that WOULD apply to a plain `Reader`: boko iterates
    #   `.attributes()` in 12 places and never calls `.with_checks(false)`.
    #   It is unreachable from pharos for a different reason — only three
    #   files in boko touch `quick_xml` at all, and the two that PARSE
    #   (`src/epub/parser.rs`, `src/import/epub.rs`) are the EPUB *importer*.
    #   pharos calls boko exclusively on `.mobi`/`.azw`/`.azw3`, whose format
    #   is chosen from the extension, so the epub importer is never entered;
    #   the Kindle path's only quick-xml use is `escape::unescape` in
    #   `src/mobi/parser.rs`, a pure string function with no reader and no
    #   attributes. pharos parses real epubs with its OWN reader on 0.41.
    #
    # Worth more care than a routine transitive ignore, because the input IS
    # user-supplied ebook files. Re-check both if pharos ever hands boko an
    # `.epub`, or if boko starts resolving namespaces. Drop the entry when
    # boko moves to quick-xml 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# cargo-deny ≥0.14 removed `unlicensed`/`copyleft`/`default` keys.
# Behaviour now: anything not in `allow` is denied automatically.
confidence-threshold = 0.92
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-or-later",
    "BSL-1.0",
    # webpki-roots ships its bundled CA list under CDLA-Permissive-2.0;
    # the upstream Mozilla CCADB data is the actual licensed payload.
    "CDLA-Permissive-2.0",
    # `notify` (the FS-watcher crate, P48/LIB-A8) is licensed CC0-1.0 —
    # a public-domain dedication, FSF Free/Libre, maximally permissive.
    "CC0-1.0",
]
# Internal workspace crates (cargo-hakari's `workspace-hack`) carry no
# license field and are never published; exempt publish = false crates.
private = { ignore = true }

[[licenses.exceptions]]
# `ring` ships under a custom non-SPDX license that's a derivative of
# ISC + BoringSSL + OpenSSL. cargo-deny matches it imperfectly.
name = "ring"
allow = ["ISC", "MIT", "OpenSSL"]

[[licenses.exceptions]]
# The `ffmpeg-the-third` libav bindings (P48 backend-lib FFI path) ship
# under WTFPL — an FSF-recognised, maximally-permissive free licence.
# Scoped exception rather than a global allow so adding WTFPL deps stays
# a deliberate decision.
name = "ffmpeg-the-third"
allow = ["WTFPL"]

[[licenses.exceptions]]
name = "ffmpeg-sys-the-third"
allow = ["WTFPL"]

[[licenses.exceptions]]
# 005-kindle-conversion — the MOBI/KF8 → EPUB converter is GPL-3.0-or-later.
#
# pharos is AGPL-3.0-or-later, and GPLv3 §13 ("Use with the GNU Affero
# General Public License") explicitly permits combining GPLv3 code with an
# AGPLv3 work, the combination being governed by the AGPL. So this is a
# compatible pairing rather than a tolerated one, and it costs nothing: the
# project is already copyleft.
#
# Scoped to this one crate, not a global `GPL-3.0-or-later` allow, so the
# next GPL dependency stays a deliberate decision — the same reasoning as
# the WTFPL entries above.
name = "boko"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates use `path = "..."` with implicit `*`
# version; that's not a real wildcard on crates.io.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # The whole point of T44 is that token bytes never leak — banning
    # rand_chacha at workspace level forces a deliberate review if a
    # contributor adds a non-CSPRNG to the auth path.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
