[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-aligner"
version = "0.1.0"
description = "Forced alignment service for Pharos karaoke"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchaudio",
]

[project.scripts]
pharos-aligner = "pharos_aligner.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pharos_aligner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
