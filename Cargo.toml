[workspace]
resolver = "2"
members = [
    "crates/pharos-cache",
    "crates/pharos-core",
    "crates/pharos-discovery",
    "crates/pharos-jellyfin-api",
    "crates/pharos-jellyfin-test-client",
    "crates/pharos-scanner",
    "crates/pharos-server",
    "crates/pharos-store-sqlx",
    "crates/pharos-sync",
    "crates/pharos-transcode",
    "crates/pharos-ui",
    "workspace-hack",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ali/pharos"
# Internal crates — distribution is via the `pharos` binary, the
# OCI image, and the nix flake, not crates.io.
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
actix-cors = "0.7"
actix-files = "0.6"
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-ws = "0.4"
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
getrandom = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
# Test-only: lets a test assert on the metrics a code path actually emitted,
# so an instrumentation contract can be verified by disarming it and watching
# the test go red rather than by reading the code.
metrics-util = "0.17"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-web = { version = "0.7", default-features = false }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
quick-xml = "0.41"
# 004-books — book containers. All three are PURE RUST with no `-sys` crate,
# which is load-bearing: single-binary deploy with no runtime dependency
# beyond ffmpeg is what rules out a PDF rasteriser (R11) and a rar reader
# (R7). An epub IS a zip, so `zip` covers epub and cbz both.
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.22", default-features = false }
# `.cbt` is a TAR of images. `tar` is pure Rust like the two above, so the
# no-C-library rule that permanently rules out `.cbr` (R7) does not apply here
# — a cbt is read for real rather than recorded as unsupported.
tar = { version = "0.4", default-features = false }
# PDF page tree + info dictionary only. `lopdf` parses; it does NOT render,
# and nothing in this workspace can — see R11.
#
# 0.44, NOT 0.34: RUSTSEC-2026-0187 is a stack overflow in 0.34 on deeply
# nested PDF objects, reachable from pharos because the scanner parses whatever
# a user drops in a media folder. A stack overflow ABORTS — it is not a
# `Result` any caller can handle — so V6's "a bad file never takes the scan
# down" cannot hold against it. `a_deeply_nested_pdf_does_not_take_the_process_
# down` asserts it; pinned back to 0.34 that test dies with SIGABRT.
# 0.44 rather than the 0.42 the advisory asks for: 0.42 and 0.43 depend on
# `ttf-parser` unconditionally, and that crate is itself flagged unmaintained
# (RUSTSEC-2026-0192), which `cargo deny check` treats as an error. 0.44 makes
# it optional, so with default features off it leaves the graph entirely —
# pharos reads the page tree, the info dictionary and image XObjects, and never
# asks lopdf to touch a font. Upgrading beats an ignore entry: the dependency
# is actually gone rather than merely tolerated.
# 0.42+ also drops the parser feature flags, so the `nom_parser`/`pom_parser`
# choice 0.34 forced (its pom variant did not compile) no longer exists.
#
# Deliberately NOT enabling `embed_image`, which pulls the `image` crate.
# R11 rests on there being no raster decoder in this workspace; a cover is
# extracted only when it is ALREADY a JPEG, so nothing needs to decode one.
lopdf = { version = "0.44", default-features = false }
# 005-kindle-conversion — MOBI/KF8 (`.mobi`/`.azw`/`.azw3`) → EPUB.
#
# Pure Rust, ZERO `unsafe`, and it carries the two pieces that make this
# format hard: a HUFF/CDIC Huffman decoder (7 of the deployed library's 17
# DRM-free Kindle files use it, PalmDOC LZ77 covers the rest) and the KF8
# skeleton/fragment index rebuild that splits one decompressed flow back
# into per-chapter XHTML. Hand-writing those is ~2000 lines against a
# format with no specification.
#
# `default-features = false` drops the `cli` feature (clap, serde_json,
# ion-rs, and the `image` crate). `image` matters: R11 rests on there being
# no raster decoder in this workspace, exactly as for lopdf above.
#
# GPL-3.0-or-later — combined with pharos's AGPL-3.0-or-later under GPLv3
# §13, which exists for precisely this pairing. See the scoped exception in
# deny.toml; it is NOT a workspace-wide allow.
boko = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sonic-rs = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "migrate"] }
thiserror = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
toml = "0.9"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
# OTLP trace export (opt-in via [obs].otlp_endpoint → Tempo/any OTLP collector).
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"

# Dev/test profile: drop full DWARF, keep line tables. Backtraces +
# assertion file:line still work; link step generates less. Note:
# changing this triggers a one-time full dep recompile (the cost has
# been paid; don't churn it). No measurable wall-time win on M-series
# darwin for the workspace as it stands today, but the smaller debug
# sections noticeably shrink target/ disk usage.

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
